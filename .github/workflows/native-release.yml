name: Publish Mini native binaries

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag for an images-only run
        type: string
        required: false
      images_only:
        description: Package an existing version's published Linux binaries without rebuilding native artifacts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    if: inputs.images_only != true
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        run: node scripts/native-release.mjs plan

  build:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libssl-dev libdbus-1-dev pkg-config clang libclang-dev cmake nasm protobuf-compiler
      - name: Set up the native Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          rustup toolchain install "stable-${TARGET}" --profile minimal
          rustup override set "stable-${TARGET}"
      - name: Build and stage pinned executable
        env:
          TOOL: ${{ matrix.tool }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: node scripts/native-release.mjs build "$TOOL" "$TARGET" release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.tool }}-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: mini-release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: release-assets
      - name: Publish complete versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: node scripts/native-release.mjs publish release-assets "$RELEASE_COMMIT"

  service-images:
    needs: [plan, publish]
    if: >-
      always() && !cancelled() &&
      (needs.publish.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.images_only && github.ref == 'refs/heads/main' && needs.publish.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04}
          - {arch: arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-platform-${{ needs.plan.outputs.tag || inputs.tag }}-${{ matrix.arch }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag || inputs.tag }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve Linux payloads from the native build
        if: needs.publish.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*-${{ matrix.target }}
          merge-multiple: true
          path: ${{ runner.temp }}/native
      - name: Package the released Linux payloads for GHCR
        run: |
          python3 docker/service-images/package.py prepare --tag "$TAG" --arch "$ARCH" --assets "$RUNNER_TEMP/native" --out "$RUNNER_TEMP/contexts"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 docker/service-images/package.py build --out "$RUNNER_TEMP/contexts" --push
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-manifests-${{ matrix.arch }}
          path: ${{ runner.temp }}/contexts/platform-${{ matrix.arch }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish-service-images:
    needs: [plan, service-images]
    if: always() && !cancelled() && needs.service-images.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    concurrency:
      group: image-index-${{ needs.plan.outputs.tag || inputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: image-manifests-*
          path: ${{ runner.temp }}/image-manifests
          merge-multiple: true
      - name: Publish the versioned image indexes and release inventory
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 docker/service-images/package.py publish --tag "$TAG" --records "$RUNNER_TEMP/image-manifests"
