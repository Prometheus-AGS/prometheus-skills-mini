name: Publish Mini native binaries

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        run: node scripts/native-release.mjs plan

  build:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libssl-dev libdbus-1-dev pkg-config clang libclang-dev cmake nasm protobuf-compiler
      - name: Set up the native Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          rustup toolchain install "stable-${TARGET}" --profile minimal
          rustup override set "stable-${TARGET}"
      - name: Build and stage pinned executable
        env:
          TOOL: ${{ matrix.tool }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: node scripts/native-release.mjs build "$TOOL" "$TARGET" release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.tool }}-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: mini-release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: release-assets
      - name: Publish complete versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: node scripts/native-release.mjs publish release-assets "$RELEASE_COMMIT"
