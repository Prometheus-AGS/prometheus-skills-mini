              - paragraph [ref=f1e340]:
                - text: This returns
                - code [ref=f1e341]: "status: \"evidence-required\""
                - text: ","
                - code [ref=f1e342]: "executed: false"
                - text: ", a checklist and an exec-form Node descriptor. It accepts no evidence fields, captures no screenshots, launches no browser and cannot certify PASS. Exit 0 only means the request was processed. Use available platform tools to collect applicable device/theme states, keyboard/focus and reduced-motion evidence; obtain independent read-only review, then one batched correction and confirmation cycle. Record evidence paths, reviewer identity, unavailable checks and unresolved findings. Outstanding blockers remain blocking; unavailable independent review remains unverified."
