                - code [ref=f1e196]: GEMINI.md
                - text: ; otherwise it uses
                - code [ref=f1e197]: AGENTS.md
                - text: . Inspect
                - code [ref=f1e198]: instructionFiles
                - text: in the record. External ACP agents retain their own native configuration. Zed's parallel-thread UI is not a delegation API. If the harness cannot delegate, use role instructions sequentially and disclose the limitation; builder review is not independent.
