                - text: for exact modes, fields, focus aliases and dial ranges.
              - heading [level=2] [ref=f1e279]:
                - text: Use Pro Max selectively
                - link "Direct link to Use Pro Max selectively" [ref=f1e280] [cursor=pointer]:
                  - /url: "#use-pro-max-selectively"
                  - text: "#"
              - paragraph [ref=f1e281]: "The shipped TypeScript 7 implementation runs directly as Node ESM with pinned data and assets. No Python, repository-root runtime dependencies, online catalog refresh or service is required. For an existing React app, for example:"
              - generic [ref=f1e283]:
                - code [ref=f1e285]:
