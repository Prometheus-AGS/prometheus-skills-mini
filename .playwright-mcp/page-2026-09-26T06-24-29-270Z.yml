              - paragraph [ref=f1e180]:
                - text: An explicit selection in
                - code [ref=f1e181]: .agent-team/project-routing.json
                - text: wins; otherwise a sole
                - code [ref=f1e182]: .agent-team/<id>/team.json
                - text: is adopted. When several teams remain, choose deliberately with
                - code [ref=f1e183]: "--team <id>"
                - text: ; stale selection is an error. For a new team, follow the
                - link "creation and installation guide" [ref=f1e184] [cursor=pointer]:
                  - /url: /prometheus-skills-mini/docs/agent-teams/overview#install-the-project-team
                - text: . Proposal-only
                - code [ref=f1e185]: export
                - text: does not complete project adoption.
              - paragraph [ref=f1e186]: Managed instruction blocks preserve unrelated prose, CRLF, existing in-project linked entrypoints and local recovery information. Creator preserves existing native file bytes, including models, permissions and concurrency; it reports differences for a deliberate merge. A routing pointer grants no native permission and does not start agents. Read the active record and real manifest for every code task, select relevant roles, and preserve their ownership. Backend work still uses its team without activating UI skills.
              - paragraph [ref=f1e187]:
                - text: Creator also updates Zed's first effective existing instruction file, from
                - code [ref=f1e188]: .rules
                - text: ","
