              - paragraph [ref=f1e121]:
                - text: Run these commands from the mini checkout with Node.js 22 or newer. Replace the quoted project path with an existing authorized project. On a machine with the full pack installed, use the full pack's bootstrap; mini belongs only in The Boss's internal data directory on that machine. These project commands do not waive the
                - link "install-scope rule" [ref=f1e122] [cursor=pointer]:
                  - /url: /prometheus-skills-mini/docs/getting-started/installation#the-install-scope-rule
                - text: .
              - paragraph [ref=f1e123]: "For layered context plus UI routing and adoption of existing teams:"
              - generic [ref=f1e125]:
                - code [ref=f1e127]:
                  - generic [ref=f1e128]: node scripts/prometheus-context-bootstrap.mjs --path "../My Project" --dry-run
                  - generic [ref=f1e129]: node scripts/prometheus-context-bootstrap.mjs --path "../My Project"
                  - generic [ref=f1e130]: node scripts/prometheus-context-bootstrap.mjs --path "../My Project" --check
