              - paragraph [ref=f1e314]:
                - text: "Only persist when requested:"
                - code [ref=f1e315]: "--persist --output-dir \"../My Project\" --page booking"
                - text: writes
                - code [ref=f1e316]: design-system/<project-slug>/MASTER.md
                - text: and page overrides. Existing files are preserved unless replacement is authorized and
                - code [ref=f1e317]: "--force"
