              - paragraph [ref=f1e273]:
                - text: At most one taste implementation and one explicitly selected overlay apply to new/redesign work. The supported overlays are
                - code [ref=f1e274]: high-end-visual-design
                - text: ","
                - code [ref=f1e275]: minimalist-ui
                - text: and
                - code [ref=f1e276]: industrial-brutalist-ui
                - text: "; refinement/review ignore overlays. Experimental/v1 identities remain separate catalog entries. One craft skill follows the task: layout, typography, colors, writing, accessibility, motion, or broad interface work. Relevant platform skills follow the nearest application manifests; a monorepo root is not evidence of every application's stack."
              - paragraph [ref=f1e277]:
                - text: Surface defaults are Persuade for marketing/landing/pricing, Operate for apps/tools, Read for docs/articles, and Experience for portfolios/showcases. Existing tokens and explicit design decisions override defaults. See the
                - link "request reference" [ref=f1e278] [cursor=pointer]:
