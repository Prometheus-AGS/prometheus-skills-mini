              - paragraph [ref=f2e158]:
                - text: Use
                - code [ref=f2e159]: prometheus-ui-ux
                - text: when work changes rendered UI, interaction, styles, tokens, motion or on-screen copy. Describe the affected application and whether you are creating, redesigning, refining or reviewing it. The router returns context to read and a small set of relevant skills. Backend-only work uses the selected project team without loading UI guidance.
              - paragraph [ref=f2e160]:
                - text: The canonical UI catalog contains
                - strong [ref=f2e161]: 41 entries
                - text: . The portable project installer and mini pack carry
                - strong [ref=f2e162]: "40"
                - text: ; full distribution also includes the optional native Impeccable integration. The full pack's generated distribution index currently lists
                - strong [ref=f2e163]: 215 skills
                - text: "across all domains. These are different inventories: the site catalog currently enumerates 194 source manifests excluding imported submodules, while the distribution index enumerates 215 packaged skills. See the"
                - link "generated catalog" [ref=f2e164] [cursor=pointer]:
                  - /url: /prometheus-skill-system/docs/catalog/ui-ux
                - text: and
