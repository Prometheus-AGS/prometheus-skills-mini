                - text: The
                - link "delivery record" [ref=f2e343] [cursor=pointer]:
                  - /url: https://github.com/Prometheus-AGS/prometheus-skill-system/blob/main/docs/research/ui-ux-routing/DELIVERY.md
                - text: separates shipped implementation from acceptance gaps. Recorded local evidence includes macOS and offline Linux Node 22 bootstrap/creator/routing scenarios, full bootstrap/injector coverage, pinned Pro Max comparisons, distribution checks and a separate skill-contract judge. These are prior implementation receipts, not new certification by this guide.
              - paragraph [ref=f2e344]: Native Windows execution, live invocation of every supported harness and a full installed Electron application run remain unverified. The native engine port is deferred. Catalog author review is self-review, and skill-contract review does not complete the ten-stage research review/export pipeline. Release certification remains open. No hosted CI result is used as validation evidence.
