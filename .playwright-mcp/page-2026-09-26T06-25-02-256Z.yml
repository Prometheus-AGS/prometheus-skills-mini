                - text: .
              - paragraph [ref=f2e280]: Surface modes are Persuade for marketing, Operate for apps, Read for documentation and Experience for showcases. They provide starting ranges for variance, motion and density; existing design decisions and reduced-motion requirements win.
              - paragraph [ref=f2e281]: Platform selection reads the nearest affected application's manifests, including nested applications. React/Vercel guidance applies to relevant components; Expo must match its declared SDK. Flutter, SwiftUI and Android retain their actual toolchain prerequisites and project versions. Tauri and Electron use the project's existing workflow. Portable guidance does not mean an unsupported host can build or profile native applications.
              - paragraph [ref=f2e282]:
                - text: Upstream
                - code [ref=f2e283]: interface-review
                - text: ","
                - code [ref=f2e284]: break
                - text: ","
                - code [ref=f2e285]: variant
                - text: and
                - code [ref=f2e286]: explain-interface
                - text: remain user-only. Automatic review uses the Prometheus reviewer and eligible craft guidance. Reading a user-only skill's source is not an invocation workaround.
              - heading [level=2] [ref=f2e287]:
                - text: Adopt the project team
