              - paragraph [ref=f2e186]:
                - text: The installer copies portable skills into
                - code [ref=f2e187]: .agents/skills
                - text: and
                - code [ref=f2e188]: .claude/skills
                - text: ", installs a protocol if none exists, and adds managed pointers to both instruction entrypoints. It preserves project protocol overrides, unrelated prose and in-project linked entrypoints. It checks marker pairs and path containment before writing and retains recovery records for changed instructions. Malformed markers or escaping links must be resolved before installation; repeatedly forcing a bootstrap is not a repair procedure."
              - paragraph [ref=f2e189]:
                - text: Full-pack context bootstrap, including legacy and v4 layouts, and the existing UI rules injector call this same helper. Use the direct Node commands above when only UI routing is needed. Broader bootstrap has its own shell/tool prerequisites and changes beyond UI routing. In projects whose instruction files are generated, add the routing instructions to
                - code [ref=f2e190]: rules/src/routing.md
                - text: before regenerating; do not rely on an edit to generated output. Exact
                - link "bootstrap and injector examples" [ref=f2e191] [cursor=pointer]:
                  - /url: https://github.com/Prometheus-AGS/prometheus-skill-system/blob/main/docs/reference/ui-ux-routing.md
                - text: are in the command reference.
              - heading [level=2] [ref=f2e192]:
                - text: Preserve the project's design decisions
                - link "Direct link to Preserve the project's design decisions" [ref=f2e193] [cursor=pointer]:
