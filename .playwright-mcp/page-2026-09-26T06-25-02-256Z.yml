              - paragraph [ref=f2e307]:
                - text: An existing selection in
                - code [ref=f2e308]: .agent-team/project-routing.json
                - text: wins. Without one, a sole
                - code [ref=f2e309]: .agent-team/<id>/team.json
                - text: is adopted. Multiple candidates require an explicit
                - code [ref=f2e310]: "--team <id>"
                - text: selection; a stale selection is an error. The installed pointer makes relevant selected roles the default for
                - strong [ref=f2e311]: all code tasks
                - text: . UI roles receive conditional routing; backend tasks stay free of UI guidance.
              - paragraph [ref=f2e312]:
                - text: Creator
                - code [ref=f2e313]: export
                - text: stages a proposal into a new directory.
                - code [ref=f2e314]: install-project
                - text: installs discovery instructions, the routing record and missing native definitions. Normal project-team creation finishes with installation after inspection. Existing native files, permissions, model settings, concurrency and ownership are preserved; differences are reported for a deliberate merge. Neither command starts a team or activates a service registration.
              - paragraph [ref=f2e315]:
                - text: Use native delegation only when the active harness exposes it. Otherwise follow the selected role instructions sequentially and disclose that limitation. Builder-context review is not independent review. Zed receives the pointer in its first effective existing instruction file as well as the standard entrypoints; external ACP agents retain their own configuration. Zed's parallel-thread UI does not establish a delegation API. See
                - link "agent teams" [ref=f2e316] [cursor=pointer]:
                  - /url: /prometheus-skill-system/docs/guide/agent-teams
                - text: for creation and handoff.
              - heading [level=2] [ref=f2e317]:
                - text: Finish the phase, then collect evidence
                - link "Direct link to Finish the phase, then collect evidence" [ref=f2e318] [cursor=pointer]:
                  - /url: "#finish-the-phase-then-collect-evidence"
                  - text: "#"
              - paragraph [ref=f2e319]:
                - text: Complete the entire authorized production phase before verification. Change the request operation to
                - code [ref=f2e320]: review
                - text: "and run:"
              - generic [ref=f2e322]:
                - code [ref=f2e324]:
                  - generic [ref=f2e325]: node skills/ui-ux/prometheus-ui-ux/scripts/cli.mjs phase-boundary --input ui-request.json
                - generic [ref=f2e326]:
