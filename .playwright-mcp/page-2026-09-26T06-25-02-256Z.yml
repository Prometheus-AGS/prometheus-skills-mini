                  - text: "#"
              - paragraph [ref=f2e194]:
                - text: Read the project override
                - code [ref=f2e195]: .agents/UI_UX_PROTOCOL.md
                - text: when present, otherwise the bundled protocol. Load
                - code [ref=f2e196]: PRODUCT.md
                - text: ","
                - code [ref=f2e197]: DESIGN.md
                - text: ","
                - code [ref=f2e198]: .impeccable.md
                - text: ", the affected application's surface brief, existing components and tokens before choosing direction. A missing design document does not turn an existing application into a blank canvas."
              - paragraph [ref=f2e199]:
                - text: Pro Max supplies focused domain and stack recommendations. Its TypeScript 7 source ships as Node ESM with pinned data; the full and mini portable helpers use identical bytes. Ordinary refinement and review use focused search. Generate a complete design system only when establishing or explicitly replacing direction. Persisted Pro Max output stays under
                - code [ref=f2e200]: design-system/<project>/
                - text: ; Stitch uses
                - code [ref=f2e201]: DESIGN.stitch.md
                - text: . Neither overrides approved
                - code [ref=f2e202]: DESIGN.md
                - text: or incumbent tokens.
              - paragraph [ref=f2e203]:
                - text: Full-only Impeccable engine execution requires an explicitly configured, preinstalled
                - code [ref=f2e204]: IMPECCABLE_BIN
                - text: . The launcher never downloads an engine. When unavailable, read project context directly and continue with permitted guidance. Mini uses
                - code [ref=f2e205]: prometheus-impeccable-core
                - text: ", an explicitly bounded context and craft adaptation. It does not provide native detector hooks, engine heuristics or live-browser parity. The proposed Node engine port remains deferred."
              - heading [level=2] [ref=f2e206]:
                - text: Route a task
                - link "Direct link to Route a task" [ref=f2e207] [cursor=pointer]:
