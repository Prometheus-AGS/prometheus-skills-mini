                - text: .
              - heading [level=2] [ref=f2e166]:
                - text: Add UI guidance to a project
                - link "Direct link to Add UI guidance to a project" [ref=f2e167] [cursor=pointer]:
                  - /url: "#add-ui-guidance-to-a-project"
                  - text: "#"
              - paragraph [ref=f2e168]: Run these commands from the full pack checkout, replacing the project path with an existing authorized directory. For installed skills, use the actual skill directory reported by your harness. Node.js 22 or newer runs the shipped helpers without a TypeScript installation or network service.
              - generic [ref=f2e170]:
                - code [ref=f2e172]:
                  - generic [ref=f2e173]: node skills/ui-ux/prometheus-ui-ux/scripts/cli.mjs install --project "/path/to/project" --dry-run
                  - generic [ref=f2e174]: node skills/ui-ux/prometheus-ui-ux/scripts/cli.mjs install --project "/path/to/project"
                  - generic [ref=f2e175]: node skills/ui-ux/prometheus-ui-ux/scripts/cli.mjs install --project "/path/to/project" --check
