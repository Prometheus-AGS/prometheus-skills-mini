              - paragraph [ref=f2e272]:
                - text: "New work and redesign allow at most one direction implementation and one explicitly chosen overlay. Experimental/v1 taste identities remain distinct. Craft selection is narrow: layout →"
                - code [ref=f2e273]: better-layout
                - text: ; typography →
