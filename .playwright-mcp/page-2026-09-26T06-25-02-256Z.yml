                  - button "Copy code to clipboard" [ref=f2e330] [cursor=pointer]
              - paragraph [ref=f2e336]:
                - text: The response is
                - code [ref=f2e337]: "status: \"evidence-required\""
                - text: and
                - code [ref=f2e338]: "executed: false"
                - text: . It supplies routing, a checklist and a Node hook descriptor. It accepts no evidence fields, captures no screenshots, launches no browser and cannot certify PASS. Exit 0 means the request was processed. Wire it to an existing completed-phase runner, never a per-edit event.
              - paragraph [ref=f2e339]: Collect applicable device widths, theme states, real-content captures, keyboard focus and reduced-motion evidence with available platform tools. Obtain independent read-only review in a separate context, then use one batched correction and confirmation cycle. Record reviewer identity, evidence paths, unresolved findings and platform gaps. Missing independent review stays unverified; unresolved blockers stay blocking.
              - heading [level=2] [ref=f2e340]:
                - text: What the existing evidence establishes
                - link "Direct link to What the existing evidence establishes" [ref=f2e341] [cursor=pointer]:
