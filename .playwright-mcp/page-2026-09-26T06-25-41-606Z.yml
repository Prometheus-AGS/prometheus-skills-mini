  - heading "Get The Boss" [level=2] [ref=f3e14]
  - paragraph [ref=f3e15]:
    - text: Download the installer for your platform and architecture from
    - link "The Boss releases" [ref=f3e16] [cursor=pointer]:
      - /url: https://github.com/Prometheus-AGS/the-boss/releases
    - text: . Read that release's notes and platform records for its available installers, UAR profile, signing status, and acceptance evidence. Source support for a platform does not establish that a tested installer is available for it.
  - paragraph [ref=f3e17]:
    - text: The documentation on
    - code [ref=f3e18]: main
