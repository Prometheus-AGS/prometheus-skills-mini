    - listitem [ref=f3e25]: Knowledge, document, code, and Markdown workflows.
    - listitem [ref=f3e26]: Prometheus settings for packaged skills, workspace indexing, tools, and optional services.
    - listitem [ref=f3e27]: Shared renderer components, semantic design tokens, and light/dark themes.
