    - text: establish that the 2.2.2 installers contain them. Use the
    - link "release runbook" [ref=f3e20] [cursor=pointer]:
      - /url: docs/contrib/the-boss-release.md
    - text: for packaging and installed acceptance.
  - heading "Workspace capabilities" [level=2] [ref=f3e21]
  - list [ref=f3e22]:
