# Local packaging overlay. MINI_IMAGE_CONTEXTS is the absolute output of package.py prepare.
services:
  surreal-memory:
    image: prometheus-mini-local/surreal-memory:${MINI_IMAGE_VERSION:?Set the prepared version tag}
    platform: linux/${MINI_IMAGE_ARCH:?Set the prepared Linux architecture}
    build:
      context: ${MINI_IMAGE_CONTEXTS:?Prepare the release image contexts}/surreal-memory
  liter-llm:
    image: prometheus-mini-local/liter-llm:${MINI_IMAGE_VERSION:?Set the prepared version tag}
    platform: linux/${MINI_IMAGE_ARCH:?Set the prepared Linux architecture}
    build:
      context: ${MINI_IMAGE_CONTEXTS:?Prepare the release image contexts}/liter-llm
