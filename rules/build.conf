# Which stack rule files (rules/src/tech/<name>.md) this project renders. Domain and project rules always render.
stacks="rust"

# Byte-identical copies of CLAUDE.md for other harnesses. Copies, not symlinks: symlinks need Developer Mode
# or elevation on Windows. Add GEMINI.md here if that harness is ever used.
mirrors="AGENTS.md"

# Nested AGENTS.md for harnesses without path-scoped rules: <dir>:<source>,<source>… Rendered only if <dir> exists.
nested="skills:domain/agent-runtime lib:project/node-scripts,domain/architecture scripts:project/node-scripts hooks:project/node-scripts docker:project/docker-services,domain/security-boundaries"

# Render .cursor/rules/*.mdc as well (openspec init configured Cursor for this repo).
cursor="yes"
